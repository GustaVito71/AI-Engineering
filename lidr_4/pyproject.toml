[project]
name = "estimador-estructurado"
version = "0.4.0"
description = "Servicio de estimación de software impulsado por IA, con entrada tipada y prompts de Jinja2 versionados, salida estructurada validada, guardrails y caché semántico sobre LiteLLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",    
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Router, retries, fallbacks, structured output y tracking de coste.
    # Trae `openai` y `anthropic` como dependencias transitivas, así que no
    # hace falta declararlas acá: importarlas directo desde nuestro código
    # sería volver al acoplamiento que LiteLLM viene a eliminar.
    "litellm>=1.50",
    "redis>=5.0",
    "streamlit>=1.40",
    "httpx>=0.27",
    # Plantillas versionadas.
    "jinja2>=3.1",
    # YAML para ejemplos por versión.
    "pyyaml>=6.0",
    # Parseo incremental del JSON que llega por streaming.
    "ijson>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "fakeredis>=2.21",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
# Esto es una aplicación, no una librería. Sin esto uv intenta construir el
# paquete en cada `uv sync` y falla buscando un layout src/ que no existe.
package = false

[tool.pytest.ini_options]
# auto: los def async se corren con anyio, los def sync como tests normales,
# sin decoro asyncio. Requiere pytest-asyncio en el grupo dev.
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# `Depends()` como default de parámetro es el patrón idiomático de FastAPI
# (la resolución la hace el framework en runtime, no Python). No es un bug:
# se declara en la config en vez de silenciar cada línea con `# noqa: B008`.
extend-immutable-calls = ["fastapi.Depends"]
